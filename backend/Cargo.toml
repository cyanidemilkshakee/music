[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.1"
tokio = { version = "1.43", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6", features = ["timeout", "catch-panic", "compression-full", "limit", "set-header", "fs", "cors"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.19", features = ["derive"] }
uuid = { version = "1.12", features = ["v4", "fast-rng"] }
sha1_smol = "1.0"
thiserror = "2.0"
anyhow = "1.0"
once_cell = "1.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-log = "0.2"
mimalloc = { version = "0.1.43", default-features = false }
bytes = "1.10"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
num_cpus = "1.16"
tempfile = "3.16"
http-range-header = "0.4.2"
dashmap = "6.1"
lru = "0.13"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
hyper = "1.5"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
proptest = "1.6"
criterion = "0.5"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level       = 3
lto             = "thin"
codegen-units   = 1
strip           = "debuginfo"
panic           = "unwind"
overflow-checks = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic       = "deny"
pedantic    = "warn"
