[package]
name = "backend"
version = "1.1.0"
license = "MIT"
publish = false
edition = "2021"
rust-version = "1.97.1"

[dependencies]
axum = "0.8.1"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "io-util", "sync", "time"] }
tower = { version = "0.5.2", features = ["limit"] }
tower-http = { version = "0.6", features = ["compression-full", "limit"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.12", features = ["v4", "fast-rng"] }
sha1_smol = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = "0.3"
tempfile = "3.16"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
urlencoding = "2.1"
chrono = "0.4"
dotenvy = "0.15.7"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
mimalloc = { version = "0.1.43", default-features = false }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level       = 3
lto             = "thin"
codegen-units   = 1
strip           = "debuginfo"
panic           = "unwind"
overflow-checks = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic       = "deny"
